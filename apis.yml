aid: paq-therapeutics
name: PAQ Therapeutics
description: 'PAQ Therapeutics is a clinical-stage biotechnology company headquartered
  at 100 Summit Drive, Burlington, Massachusetts, developing targeted protein degradation
  (TPD) medicines for KRAS-driven cancers. Rather than inhibiting the KRAS oncoprotein,
  PAQ''s autophagy-based degrader chemistry recruits the cell''s own natural degradation
  machinery to remove the protein outright, an approach the company applies to the
  KRAS mutations found in roughly a quarter of human tumors, most notably lung, colorectal
  and pancreatic cancer. Its lead program, PT0511, is a pan-KRAS degrader that dosed
  its first patient in a Phase 1 trial in January 2026. The company was co-founded
  by Nan Ji (Chief Executive Officer) and Huaixiang Hao (Head of Research), with Andrew
  Krivoshik as Chief Medical Officer. PAQ Therapeutics is a therapeutics developer,
  not a software vendor: it operates a four-page corporate WordPress site and publishes
  no API, SDK, developer portal or machine-readable contract of any kind.'
